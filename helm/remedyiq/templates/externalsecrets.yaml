apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "remedyiq.fullname" . }}-secrets-ext
  labels:
    {{- include "remedyiq.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "remedyiq.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_URL
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: postgres_url
    - secretKey: CLICKHOUSE_URL
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: clickhouse_url
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: redis_url
    - secretKey: NATS_URL
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: nats_url
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: s3_access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: s3_secret_key
    - secretKey: S3_BUCKET
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: s3_bucket
    - secretKey: CLERK_SECRET_KEY
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: clerk_secret_key
    - secretKey: GOOGLE_API_KEY
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: google_api_key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: {{ .Values.secrets.managerPath }}
        property: anthropic_api_key
