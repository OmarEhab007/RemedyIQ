apiVersion: v1
kind: Service
metadata:
  name: {{ include "remedyiq.fullname" . }}-frontend
  labels:
    {{- include "remedyiq.frontendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "remedyiq.frontendSelectorLabels" . | nindent 4 }}
