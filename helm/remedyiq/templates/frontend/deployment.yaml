apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remedyiq.fullname" . }}-frontend
  labels:
    {{- include "remedyiq.frontendLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "remedyiq.frontendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "remedyiq.frontendSelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "remedyiq.frontendServiceAccountName" . }}
      containers:
        - name: frontend
          image: {{ include "remedyiq.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.frontend.env.nextPublicApiUrl | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- if .Values.frontend.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.frontend.podAntiAffinity "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "remedyiq.frontendSelectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
          {{- else if eq .Values.frontend.podAntiAffinity "preferred" }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "remedyiq.frontendSelectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
          {{- end }}
      {{- end }}
