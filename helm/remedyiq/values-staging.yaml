image:
  tag: staging-latest

api:
  replicas: 1
  hpa:
    minReplicas: 1
    maxReplicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicas: 1
  bleveStorage:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

frontend:
  replicas: 1
  hpa:
    minReplicas: 1
    maxReplicas: 2
  ingress:
    host: staging.remedyiq.com
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

environment: staging
logLevel: debug

secrets:
  managerPath: /remedyiq/staging

nats:
  config:
    cluster:
      enabled: false
      replicas: 1

clickhouse:
  replicasCount: 1
  storage:
    size: 20Gi
